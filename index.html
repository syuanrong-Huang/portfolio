<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>街角作品集｜互動展示牆</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background: #1c1a17;
      position: relative;
    }

    /* ================= 1. 滿版清晰街景背景 ================= */
    .street-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('./bg.jpg?v=26');
      background-size: cover;
      background-position: 69.5% center;
      background-repeat: no-repeat;
      transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: filter, transform;
    }

    body.zoomed .street-scene {
      filter: blur(12px) brightness(0.62);
      transform: scale(1.04);
    }

    /* ================= 2. 頂部簡潔進度提示 ================= */
    .header-guide {
      position: absolute;
      top: 20px;
      left: 28px;
      z-index: 20;
      background: rgba(24, 22, 20, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      font-size: 13px;
      color: #f8fafc;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    body.zoomed .header-guide {
      opacity: 0;
      pointer-events: none;
    }

    /* ================= 3. 電線桿上的 9 張傳單容器（放寬至 204px，善用左右兩側柱身空間） ================= */
    .pole-flyers-zone {
      position: absolute;
      left: 69.5%;
      top: 50%;
      width: 204px;
      height: 96vh;
      transform: translate(-50%, -50%);
      perspective: 540px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    body.zoomed .pole-flyers-zone {
      opacity: 0;
      pointer-events: none;
    }

    /* 單張傳單（標準 A4 比例 88x124px，伏貼於電線桿圓柱上） */
    .mini-flyer {
      position: absolute;
      width: 88px;
      height: 124px;
      cursor: pointer;
      transition:
        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.25s ease;
      transform-style: preserve-3d;
    }

    .mini-flyer:hover {
      transform: translate(-50%, -50%) scale(1.26) rotateY(0deg) rotate(0deg) !important;
      z-index: 99 !important;
      filter: brightness(1.04) !important;
    }

    /* ================= 4. 微風吹拂紙張飄動動畫 ================= */
    @keyframes paperFlutterA {
      0%, 42%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: -2px 4px 9px rgba(15, 14, 12, 0.45);
      }
      52% {
        transform: rotateX(17deg) rotateY(-5deg) skewX(-1.6deg);
        box-shadow: -5px 12px 17px rgba(15, 14, 12, 0.36);
      }
      60% {
        transform: rotateX(7deg) rotateY(2.5deg) skewX(0.8deg);
        box-shadow: -3px 7px 12px rgba(15, 14, 12, 0.42);
      }
      68% {
        transform: rotateX(13deg) rotateY(-3.5deg) skewX(-1.2deg);
        box-shadow: -4px 10px 15px rgba(15, 14, 12, 0.38);
      }
      78% {
        transform: rotateX(2.5deg) rotateY(1deg) skewX(0.3deg);
        box-shadow: -2px 5px 10px rgba(15, 14, 12, 0.44);
      }
    }

    @keyframes paperFlutterB {
      0%, 38%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: -2px 4px 9px rgba(15, 14, 12, 0.45);
      }
      49% {
        transform: rotateX(19deg) rotateY(5.5deg) skewX(1.8deg);
        box-shadow: -6px 13px 18px rgba(15, 14, 12, 0.36);
      }
      58% {
        transform: rotateX(8deg) rotateY(-2deg) skewX(-0.7deg);
        box-shadow: -3px 7px 12px rgba(15, 14, 12, 0.42);
      }
      67% {
        transform: rotateX(14deg) rotateY(4deg) skewX(1.3deg);
        box-shadow: -4px 10px 16px rgba(15, 14, 12, 0.38);
      }
      76% {
        transform: rotateX(2.5deg) rotateY(-1deg) skewX(-0.3deg);
        box-shadow: -2px 5px 10px rgba(15, 14, 12, 0.44);
      }
    }

    .paper-sheet {
      width: 100%;
      height: 100%;
      background: #fdfbf7;
      border-radius: 2px;
      position: relative;
      transform-origin: 50% 4px;
      transform-style: preserve-3d;
      box-shadow: -2px 3px 8px rgba(15, 14, 12, 0.48);
      will-change: transform, box-shadow;
    }

    .mini-flyer.can-flutter .paper-sheet {
      animation-duration: 6.5s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .mini-flyer.double-taped .paper-sheet {
      box-shadow: -1.5px 2.5px 6px rgba(15, 14, 12, 0.5);
    }

    .mini-flyer:hover .paper-sheet {
      animation-play-state: paused;
      transform: rotateX(0deg) rotateY(0deg) skewX(0deg) !important;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65) !important;
    }

    .mini-flyer.is-next {
      z-index: 50 !important;
    }

    .mini-flyer.is-read .mini-flyer-inner::after {
      content: "✓";
      position: absolute;
      bottom: 5px;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      background: rgba(24, 22, 20, 0.68);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-flyer-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 7px;
    }

    .cylinder-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
    }

    .mini-flyer-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-tape-top {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      width: 28px;
      height: 7px;
      z-index: 10;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.32);
    }

    .mini-tape-bottom {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(1.5deg);
      width: 28px;
      height: 7px;
      z-index: 10;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.32);
    }

    .mini-tag {
      font-size: 7px;
      font-weight: 800;
      opacity: 0.75;
      letter-spacing: 0.2px;
    }

    .mini-title {
      font-size: 10px;
      font-weight: 800;
      line-height: 1.24;
      margin-top: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-num {
      font-size: 8.5px;
      font-weight: 800;
      opacity: 0.75;
      border-top: 1px dashed rgba(0, 0, 0, 0.25);
      padding-top: 2px;
      text-align: right;
    }

    /* ================= 5. 動態引導滑鼠鼠標 ================= */
    .guide-cursor {
      position: absolute;
      width: 44px;
      height: 44px;
      z-index: 80;
      pointer-events: none;
      transition:
        left 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease;
    }

    @keyframes cursorRipple {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0.85;
      }
      75% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
    }

    .cursor-ripple {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      background: rgba(255, 255, 255, 0.25);
      animation: cursorRipple 1.6s infinite ease-out;
    }

    @keyframes cursorTap {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      45% {
        transform: translate(-3px, -4px) scale(0.92);
      }
      65% {
        transform: translate(0, 0) scale(1);
      }
    }

    .cursor-hand {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
      animation: cursorTap 1.6s infinite ease-in-out;
    }

    @media (max-width: 768px) {
      .header-guide {
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        padding: 7px 14px;
        white-space: nowrap;
      }
      .pole-flyers-zone {
        left: 67.5%;
        width: 164px;
      }
      .mini-flyer {
        width: 70px;
        height: 99px;
      }
    }

    /* ================= 6. Zoom-in 放大閱讀視窗（純粹海報全圖，完整呈現不裁切） ================= */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.zoomed .reader-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-card {
      position: relative;
      border-radius: 8px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.68);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.84) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.zoomed .reader-card {
      transform: scale(1) translateY(0);
    }

    .btn-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(24, 22, 20, 0.82);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 60;
    }

    .btn-close:hover {
      background: rgba(24, 22, 20, 0.96);
      transform: scale(1.06);
    }

    .reader-card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
    }

    .back-hint {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .back-hint:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 1. 滿版清晰街景背景 -->
  <div class="street-scene" id="streetScene"></div>

  <!-- 2. 頂部進度提示 -->
  <div class="header-guide" id="headerGuide">
    <span id="guideText">👆 跟著小手鼠標，從第 1 張傳單開始依序點擊閱讀（0 / 9）</span>
  </div>

  <!-- 3. 電線桿上的 9 張傳單區 -->
  <div class="pole-flyers-zone" id="poleFlyersZone"></div>

  <!-- 4. Zoom-in 放大閱讀視窗 -->
  <div class="reader-overlay" id="readerOverlay">
    <button class="btn-close" id="closeBtn" title="返回電線桿 (ESC)">✕</button>
    <div class="reader-card" id="readerCard"></div>
    <div class="back-hint" id="backHint">點擊空白處或按 ESC 返回電線桿挑選下一張</div>
  </div>

  <script>
    const FLYERS_DATA = [
      { tag: "PAGE 01", heading: "作品集 01", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./1.png" },
      { tag: "PAGE 02", heading: "作品集 02", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./2.png" },
      { tag: "PAGE 03", heading: "作品集 03", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./3.png" },
      { tag: "PAGE 04", heading: "作品集 04", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./4.png" },
      { tag: "PAGE 05", heading: "作品集 05", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./5.png" },
      { tag: "PAGE 06", heading: "作品集 06", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./6.png" },
      { tag: "PAGE 07", heading: "作品集 07", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./7.png" },
      { tag: "PAGE 08", heading: "作品集 08", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./8.png" },
      { tag: "PAGE 09", heading: "作品集 09", bgColor: "#fbcfe8", textColor: "#831843", imageUrl: "./9.png" }
    ];

    /**
     * 往左右兩側擴張拉開的 9 張座標（在 204px 容器內，x 推開至 -21% ~ +22%）：
     * - #01 獨立置頂（y: 8%）且層級最高，整頁完整露出不被壓住
     * - #02 ~ #09 善用電線桿左右兩側空間拉開橫向間距，減少重疊並露出更多電線桿底色
     */
    const POLE_LAYOUT = [
      { x: -12, y:  8.0, rot: -2, doubleTape: true  }, // #01：獨立置頂，整頁完整露出不被壓住
      { x:  21, y: 19.0, rot:  4, doubleTape: true  }, // #02：往右側圓柱邊緣拉開
      { x: -21, y: 29.5, rot: -3, doubleTape: false }, // #03：往左側圓柱邊緣拉開
      { x:  20, y: 40.0, rot:  3, doubleTape: true  }, // #04：往右側圓柱邊緣拉開
      { x:  -2, y: 50.0, rot: -2, doubleTape: false }, // #05：居中微偏左
      { x: -21, y: 60.5, rot:  4, doubleTape: true  }, // #06：往左側圓柱邊緣拉開
      { x:  22, y: 70.5, rot: -3, doubleTape: false }, // #07：往右側圓柱邊緣拉開
      { x: -19, y: 81.0, rot: -3, doubleTape: true  }, // #08：貼合左側下方警示區
      { x:  18, y: 91.5, rot:  3, doubleTape: false }  // #09：貼合右側下方警示區
    ];

    const TAPE_COLORS = [
      "rgba(215, 42, 42, 0.85)",
      "rgba(234, 179, 8, 0.82)",
      "rgba(214, 195, 165, 0.88)",
      "rgba(59, 130, 246, 0.78)"
    ];

    const poleFlyersZone = document.getElementById("poleFlyersZone");
    const guideText = document.getElementById("guideText");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerCard = document.getElementById("readerCard");
    const closeBtn = document.getElementById("closeBtn");
    const backHint = document.getElementById("backHint");

    const visitedSet = new Set();
    let guideCursorEl = null;

    function getNextUnreadIndex() {
      for (let i = 0; i < FLYERS_DATA.length; i++) {
        if (!visitedSet.has(i)) return i;
      }
      return -1;
    }

    function ensureGuideCursor() {
      if (!guideCursorEl) {
        guideCursorEl = document.createElement("div");
        guideCursorEl.className = "guide-cursor";
        guideCursorEl.innerHTML = `
          <div class="cursor-ripple"></div>
          <svg class="cursor-hand" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.5 5.5C11.5 4.11929 12.6193 3 14 3C15.3807 3 16.5 4.11929 16.5 5.5V13.5H17.5C18.6046 13.5 19.5 14.3954 19.5 15.5V16.2H20.5C21.6046 16.2 22.5 17.0954 22.5 18.2V19C23.6046 19 24.5 19.8954 24.5 21V24.5C24.5 27.5376 22.0376 30 19 30H14.5C11.8 30 9.8 28.4 8.4 26.2L5.3 21.3C4.5 20.1 4.9 18.5 6.1 17.7C7.2 17 8.7 17.3 9.5 18.4L11.5 21V5.5Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      }
      if (!poleFlyersZone.contains(guideCursorEl)) {
        poleFlyersZone.appendChild(guideCursorEl);
      }
    }

    function updateCursorPosition(nextIdx) {
      ensureGuideCursor();
      if (nextIdx === -1) {
        guideCursorEl.style.opacity = "0";
        return;
      }
      const pos = POLE_LAYOUT[nextIdx] || { x: 0, y: 50 };
      const cursorLeft = 50 + pos.x + 2;
      const cursorTop = pos.y + 3;
      guideCursorEl.style.opacity = "1";
      guideCursorEl.style.left = `${cursorLeft}%`;
      guideCursorEl.style.top = `${cursorTop}%`;
    }

    function renderAllPoleFlyers() {
      const flyersOnly = poleFlyersZone.querySelectorAll(".mini-flyer");
      flyersOnly.forEach(el => el.remove());

      const total = FLYERS_DATA.length;
      const nextIdx = getNextUnreadIndex();

      if (visitedSet.size === 0) {
        guideText.textContent = `👆 跟著小手鼠標，從第 1 張傳單開始依序點擊閱讀（0 / ${total}）`;
      } else if (nextIdx !== -1) {
        guideText.textContent = `👆 請繼續點擊小手鼠標指著的第 ${nextIdx + 1} 張傳單（已閱 ${visitedSet.size} / ${total}）`;
      } else {
        guideText.textContent = `🎉 已瀏覽全部 ${total} 張作品！可隨時點擊任一張重看`;
      }

      FLYERS_DATA.forEach((item, index) => {
        const pos = POLE_LAYOUT[index] || { x: 0, y: 50, rot: 0, doubleTape: false };
        const flyer = document.createElement("div");
        flyer.className = "mini-flyer";
        flyer.classList.add(pos.doubleTape ? "double-taped" : "can-flutter");

        const isNext = index === nextIdx;
        const isRead = visitedSet.has(index);

        if (isNext) flyer.classList.add("is-next");
        if (isRead) flyer.classList.add("is-read");

        const leftPercent = 50 + pos.x;
        // 順著圓柱左右邊緣的曲率透視傾角，讓拉開後的兩側傳單依然伏貼在柱身上
        const curveRotateY = pos.x * 1.65;
        const shadeBrightness = (isRead ? 0.94 : 1) - Math.max(0, pos.x * 0.006);

        flyer.style.left = `${leftPercent}%`;
        flyer.style.top = `${pos.y}%`;
        flyer.style.zIndex = index === 0 ? 60 : (isNext ? 50 : 30 - index);
        flyer.style.transform = `translate(-50%, -50%) rotateY(${curveRotateY}deg) rotate(${pos.rot}deg)`;
        flyer.style.filter = `brightness(${shadeBrightness.toFixed(2)})`;

        const tapeColor = TAPE_COLORS[index % TAPE_COLORS.length];

        const tapeTop = document.createElement("div");
        tapeTop.className = "mini-tape-top";
        tapeTop.style.background = tapeColor;
        flyer.appendChild(tapeTop);

        if (pos.doubleTape) {
          const tapeBottom = document.createElement("div");
          tapeBottom.className = "mini-tape-bottom";
          tapeBottom.style.background = tapeColor;
          flyer.appendChild(tapeBottom);
        }

        const paperSheet = document.createElement("div");
        paperSheet.className = "paper-sheet";

        if (!pos.doubleTape) {
          const animName = index % 2 === 0 ? "paperFlutterA" : "paperFlutterB";
          const waveDelay = (pos.y * 0.025 + (index % 3) * 0.35).toFixed(2);
          paperSheet.style.animationName = animName;
          paperSheet.style.animationDelay = `${waveDelay}s`;
        }

        const inner = document.createElement("div");
        inner.className = "mini-flyer-inner";
        inner.style.backgroundColor = item.bgColor;
        inner.style.color = item.textColor;

        const shade = document.createElement("div");
        shade.className = "cylinder-shade";
        if (pos.x < -8) {
          shade.style.background = "linear-gradient(90deg, rgba(0,0,0,0.18) 0%, rgba(255,255,255,0.16) 35%, rgba(0,0,0,0.03) 100%)";
        } else if (pos.x > 8) {
          shade.style.background = "linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.1) 55%, rgba(0,0,0,0.3) 100%)";
        } else {
          shade.style.background = "linear-gradient(90deg, rgba(0,0,0,0.07) 0%, rgba(255,255,255,0.1) 45%, rgba(0,0,0,0.13) 100%)";
        }

        if (item.imageUrl && item.imageUrl.trim() !== "") {
          const img = document.createElement("img");
          img.src = item.imageUrl;
          img.alt = "";
          img.onerror = () => {
            img.remove();
            inner.insertAdjacentHTML("afterbegin", `
              <div>
                <div class="mini-tag">${item.tag}</div>
                <div class="mini-title">${item.heading}</div>
              </div>
              <div class="mini-num">#${String(index + 1).padStart(2, "0")}</div>
            `);
          };
          inner.appendChild(img);
        }

        inner.appendChild(shade);
        paperSheet.appendChild(inner);
        flyer.appendChild(paperSheet);
        flyer.addEventListener("click", () => openZoomReader(index));
        poleFlyersZone.appendChild(flyer);
      });

      updateCursorPosition(nextIdx);
    }

    function openZoomReader(index) {
      visitedSet.add(index);
      const item = FLYERS_DATA[index];
      readerCard.innerHTML = `<img src="${item.imageUrl}" alt="" />`;
      document.body.classList.add("zoomed");
    }

    function closeZoomReader() {
      document.body.classList.remove("zoomed");
      renderAllPoleFlyers();
    }

    closeBtn.addEventListener("click", closeZoomReader);
    backHint.addEventListener("click", closeZoomReader);
    readerOverlay.addEventListener("click", (e) => {
      if (e.target === readerOverlay) closeZoomReader();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("zoomed")) {
        closeZoomReader();
      }
    });

    renderAllPoleFlyers();
  </script>
</body>
</html>
