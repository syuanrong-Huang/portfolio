<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shuyenhuangportfolio</title>
  <meta property="og:title" content="shuyenhuangportfolio" />
  <meta property="og:description" content=" " />
  <meta name="description" content=" " />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background: #1c1a17;
      position: relative;
    }

    /* ================= 1. 動態街景影片背景 ================= */
    .scene-wrapper {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: filter, transform;
    }

    body.zoomed .scene-wrapper {
      filter: blur(12px) brightness(0.62);
      transform: scale(1.04);
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 70.5% center;
      pointer-events: none;
    }

    /* ================= 2. 電線桿上的 13 張傳單容器 ================= */
    .pole-flyers-zone {
      position: absolute;
      left: 70.5%;
      top: 50%;
      transform: translate(-50%, -50%);
      perspective: 1800px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    body.zoomed .pole-flyers-zone {
      opacity: 0;
      pointer-events: none;
    }

    .mini-flyer {
      position: absolute;
      cursor: pointer;
      transition:
        transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.25s ease;
      transform-style: preserve-3d;
    }

    .mini-flyer:hover {
      transform: translate(-50%, -50%) scale(1.26) rotateY(0deg) rotate(0deg) !important;
      z-index: 99 !important;
      filter: brightness(1.04) !important;
    }

    /* ================= 3. 微風吹拂紙張飄動動畫（單段膠帶款專用） ================= */
    @keyframes paperFlutterA {
      0%, 42%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: 2px 3px 8px rgba(15, 14, 12, 0.38);
      }
      52% {
        transform: rotateX(16deg) rotateY(-4deg) skewX(-1.4deg);
        box-shadow: 5px 12px 18px rgba(15, 14, 12, 0.3);
      }
      60% {
        transform: rotateX(6deg) rotateY(2deg) skewX(0.7deg);
        box-shadow: 3px 7px 12px rgba(15, 14, 12, 0.35);
      }
      68% {
        transform: rotateX(12deg) rotateY(-3deg) skewX(-1deg);
        box-shadow: 4px 10px 15px rgba(15, 14, 12, 0.32);
      }
      78% {
        transform: rotateX(2deg) rotateY(1deg) skewX(0.3deg);
        box-shadow: 2px 4px 9px rgba(15, 14, 12, 0.37);
      }
    }

    @keyframes paperFlutterB {
      0%, 38%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: 2px 3px 8px rgba(15, 14, 12, 0.38);
      }
      49% {
        transform: rotateX(18deg) rotateY(4.5deg) skewX(1.6deg);
        box-shadow: 6px 13px 19px rgba(15, 14, 12, 0.3);
      }
      58% {
        transform: rotateX(7deg) rotateY(-1.5deg) skewX(-0.6deg);
        box-shadow: 3px 7px 12px rgba(15, 14, 12, 0.35);
      }
      67% {
        transform: rotateX(13deg) rotateY(3.5deg) skewX(1.2deg);
        box-shadow: 4px 10px 16px rgba(15, 14, 12, 0.32);
      }
      76% {
        transform: rotateX(2deg) rotateY(-1deg) skewX(-0.2deg);
        box-shadow: 2px 4px 9px rgba(15, 14, 12, 0.37);
      }
    }

    .paper-sheet {
      width: 100%;
      height: 100%;
      background: #fdfbf7;
      border-radius: 0px;
      position: relative;
      transform-origin: 50% 4px;
      transform-style: preserve-3d;
      box-shadow: 2px 3px 8px rgba(15, 14, 12, 0.4);
      will-change: transform, box-shadow;
    }

    .mini-flyer.can-flutter .paper-sheet {
      animation-duration: 6s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .mini-flyer.double-taped .paper-sheet {
      box-shadow: 1.5px 2.5px 6px rgba(15, 14, 12, 0.42);
    }

    .mini-flyer:hover .paper-sheet {
      animation-play-state: paused;
      transform: rotateX(0deg) rotateY(0deg) skewX(0deg) !important;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.65) !important;
    }

    .mini-flyer.is-next {
      z-index: 50 !important;
    }

    .mini-flyer-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 0px;
      position: relative;
    }

    .mini-flyer-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cylinder-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      transition: opacity 0.25s ease;
    }

    .mini-flyer:hover .cylinder-shade {
      opacity: 0.15;
    }

    .mini-tape-top {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(-1deg);
      width: 30%;
      height: 6px;
      z-index: 10;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    .mini-tape-bottom {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) rotate(1.5deg);
      width: 30%;
      height: 6px;
      z-index: 10;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }

    /* ================= 4. 動態引導滑鼠鼠標 ================= */
    .guide-cursor {
      position: absolute;
      width: 44px;
      height: 44px;
      z-index: 80;
      pointer-events: none;
      transition:
        left 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease;
    }

    @keyframes cursorRipple {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0.85;
      }
      75% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
    }

    .cursor-ripple {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      background: rgba(255, 255, 255, 0.25);
      animation: cursorRipple 1.6s infinite ease-out;
    }

    @keyframes cursorTap {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      45% {
        transform: translate(-3px, -4px) scale(0.92);
      }
      65% {
        transform: translate(0, 0) scale(1);
      }
    }

    .cursor-hand {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
      animation: cursorTap 1.6s infinite ease-in-out;
    }

    /* ================= 5. Zoom-in 放大閱讀視窗（支援局部放大與小圖超連結熱區） ================= */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.zoomed .reader-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-card {
      position: relative;
      border-radius: 0px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.68);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.84) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.zoomed .reader-card {
      transform: scale(1) translateY(0);
    }

    .btn-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(24, 22, 20, 0.82);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 60;
    }

    .btn-close:hover {
      background: rgba(24, 22, 20, 0.96);
      transform: scale(1.06);
    }

    .reader-card img {
      display: block;
      width: auto;
      height: auto;
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      cursor: zoom-in;
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reader-card.is-inspected img {
      transform: scale(2);
      cursor: zoom-out;
    }

    /* 局部放大時暫時隱藏熱區，避免座標偏移；還原大小後可點擊連結 */
    .reader-card.is-inspected .hotspot-link {
      pointer-events: none;
      opacity: 0;
    }

    .hotspot-link {
      position: absolute;
      z-index: 25;
      cursor: pointer;
      background: transparent;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    /* ================= 6. 熱區引導提示（閃 3 次後自動淡出） ================= */
    @keyframes hintFadeOut {
      0%, 82% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        pointer-events: none;
      }
    }

    .hotspot-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      transform: translate(-25%, -25%);
      pointer-events: none;
      z-index: 30;
      animation: hintFadeOut 4.5s ease forwards;
    }

    .hotspot-hint .cursor-ripple {
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      animation: cursorRipple 1.4s ease-out 3;
    }

    .hotspot-hint .cursor-hand {
      width: 30px;
      height: 30px;
      animation: cursorTap 1.4s ease-in-out 3;
    }

    .reader-card.is-inspected .hotspot-hint {
      opacity: 0 !important;
    }

    .back-hint {
      margin-top: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .back-hint:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 1. 動態街景影片背景 -->
  <div class="scene-wrapper" id="sceneWrapper">
    <video class="bg-video" id="bgVideo" src="./bg.mp4?v=41" poster="./bg.jpg?v=41" autoplay loop muted playsinline></video>
  </div>

  <!-- 2. 電線桿上的 13 張傳單區 -->
  <div class="pole-flyers-zone" id="poleFlyersZone"></div>

  <!-- 3. Zoom-in 放大閱讀視窗 -->
  <div class="reader-overlay" id="readerOverlay">
    <button class="btn-close" id="closeBtn" title="返回電線桿 (ESC)">✕</button>
    <div class="reader-card" id="readerCard"></div>
    <div class="back-hint" id="backHint">點擊傳單可局部放大，點擊標示區塊可開啟外部連結，點空白處或按 ESC 返回</div>
  </div>

  <script>
    const FLYERS_DATA = [
      { imageUrl: "./1.png?v=1126" },
      { imageUrl: "./2.png?v=1126" },
      { imageUrl: "./3.png?v=1126" },
      { imageUrl: "./4.png?v=1126" },
      { imageUrl: "./5.png?v=1126" },
      { imageUrl: "./6.png?v=1126" },
      { imageUrl: "./7.png?v=1126" },
      { imageUrl: "./8.png?v=1126" },
      { imageUrl: "./9.png?v=1126" },
      { imageUrl: "./10.png?v=1126" },
      { imageUrl: "./11.png?v=1126" },
      {
        // 第 12 張：社群文案（6 張 164x164pt 小圖，往上包齊圖片頂部、不含下方文字）
        imageUrl: "./12.png?v=1126",
        hotspots: [
          // 上排左、中、右
          { left:  5.8, top: 38.5, width: 27.56, height: 20, url: "https://www.facebook.com/share/p/1HVugV9jYM/", label: "Facebook 貼文 1" },
          { left: 36.2, top: 38.5, width: 27.56, height: 20, url: "https://www.facebook.com/share/p/1BjF7ULEay/", label: "Facebook 貼文 2" },
          { left: 66.6, top: 38.5, width: 27.56, height: 20, url: "https://www.facebook.com/share/p/18vQmUZkKJ/", label: "Facebook 貼文 3" },
          // 下排左、中、右
          { left:  5.8, top: 62.5, width: 27.56, height: 20, url: "https://www.instagram.com/p/Da1u2tIEy8d/?img_index=1", label: "Instagram 貼文 1" },
          { left: 36.2, top: 62.5, width: 27.56, height: 20, url: "https://www.instagram.com/p/DajtT0-gc28/?img_index=1", label: "Instagram 貼文 2" },
          { left: 66.6, top: 62.5, width: 27.56, height: 20, url: "https://www.instagram.com/reel/DYQ8EmTjZI6/", label: "Instagram Reels" }
        ]
      },
      {
        // 第 13 張：音樂媒體
        imageUrl: "./13.png?v=1126",
        hotspots: [
          {
            left: 11.8,
            top: 37.6,
            width: 39.5,
            height: 53.0,
            rotate: -9.2,
            url: "https://www.instagram.com/music_auditor/",
            label: "前往 Instagram @music_auditor"
          }
        ]
      }
    ];

    const POLE_LAYOUT = [
      { x:  -8, y:  8.5, rot: -2, doubleTape: true  },
      { x:  16, y: 15.5, rot:  3, doubleTape: false },
      { x: -17, y: 22.5, rot: -3, doubleTape: false },
      { x:  15, y: 29.5, rot:  4, doubleTape: false },
      { x:  -4, y: 36.5, rot: -2, doubleTape: false },
      { x:  17, y: 43.5, rot:  3, doubleTape: false },
      { x: -18, y: 48.5, rot: -3, doubleTape: true  },
      { x:  14, y: 57.5, rot:  2, doubleTape: false },
      { x: -16, y: 64.5, rot: -4, doubleTape: false },
      { x:   3, y: 71.5, rot:  3, doubleTape: false },
      { x: -17, y: 78.5, rot: -2, doubleTape: false },
      { x:  16, y: 85.5, rot:  4, doubleTape: true  },
      { x:  -9, y: 92.5, rot: -3, doubleTape: true  }
    ];

    const TAPE_COLORS = [
      "rgba(215, 42, 42, 0.85)",
      "rgba(234, 179, 8, 0.82)",
      "rgba(214, 195, 165, 0.88)",
      "rgba(59, 130, 246, 0.78)"
    ];

    const poleFlyersZone = document.getElementById("poleFlyersZone");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerCard = document.getElementById("readerCard");
    const closeBtn = document.getElementById("closeBtn");
    const backHint = document.getElementById("backHint");

    const visitedSet = new Set();
    let guideCursorEl = null;
    let isInspected = false;

    function syncPoleMetrics() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const imgAspect = 16 / 9;
      const winAspect = vw / vh;

      const renderedBgWidth = winAspect > imgAspect ? vw : vh * imgAspect;

      const zoneWidth = renderedBgWidth * 0.155;
      const flyerWidth = zoneWidth * 0.36;
      const flyerHeight = flyerWidth * 1.414;

      poleFlyersZone.style.width = `${zoneWidth.toFixed(1)}px`;
      poleFlyersZone.style.height = `${(vh * 0.96).toFixed(1)}px`;

      return { flyerWidth, flyerHeight };
    }

    function getNextUnreadIndex() {
      for (let i = 0; i < FLYERS_DATA.length; i++) {
        if (!visitedSet.has(i)) return i;
      }
      return -1;
    }

    function ensureGuideCursor() {
      if (!guideCursorEl) {
        guideCursorEl = document.createElement("div");
        guideCursorEl.className = "guide-cursor";
        guideCursorEl.innerHTML = `
          <div class="cursor-ripple"></div>
          <svg class="cursor-hand" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.5 5.5C11.5 4.11929 12.6193 3 14 3C15.3807 3 16.5 4.11929 16.5 5.5V13.5H17.5C18.6046 13.5 19.5 14.3954 19.5 15.5V16.2H20.5C21.6046 16.2 22.5 17.0954 22.5 18.2V19C23.6046 19 24.5 19.8954 24.5 21V24.5C24.5 27.5376 22.0376 30 19 30H14.5C11.8 30 9.8 28.4 8.4 26.2L5.3 21.3C4.5 20.1 4.9 18.5 6.1 17.7C7.2 17 8.7 17.3 9.5 18.4L11.5 21V5.5Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      }
      if (!poleFlyersZone.contains(guideCursorEl)) {
        poleFlyersZone.appendChild(guideCursorEl);
      }
    }

    function updateCursorPosition(nextIdx) {
      ensureGuideCursor();
      if (nextIdx === -1) {
        guideCursorEl.style.opacity = "0";
        return;
      }
      const pos = POLE_LAYOUT[nextIdx] || { x: 0, y: 50 };
      const cursorLeft = 50 + pos.x + 2;
      const cursorTop = pos.y + 3;
      guideCursorEl.style.opacity = "1";
      guideCursorEl.style.left = `${cursorLeft}%`;
      guideCursorEl.style.top = `${cursorTop}%`;
    }

    function renderAllPoleFlyers() {
      const { flyerWidth, flyerHeight } = syncPoleMetrics();

      const flyersOnly = poleFlyersZone.querySelectorAll(".mini-flyer");
      flyersOnly.forEach(el => el.remove());

      const nextIdx = getNextUnreadIndex();

      FLYERS_DATA.forEach((item, index) => {
        const pos = POLE_LAYOUT[index] || { x: 0, y: 50, rot: 0, doubleTape: false };
        const flyer = document.createElement("div");
        flyer.className = "mini-flyer";
        flyer.classList.add(pos.doubleTape ? "double-taped" : "can-flutter");

        flyer.style.width = `${flyerWidth.toFixed(1)}px`;
        flyer.style.height = `${flyerHeight.toFixed(1)}px`;

        const isNext = index === nextIdx;
        if (isNext) flyer.classList.add("is-next");

        const leftPercent = 50 + pos.x;
        const curveRotateY = pos.x * 0.9;
        const sideBrightness = 0.97 - pos.x * 0.0045;

        flyer.style.left = `${leftPercent}%`;
        flyer.style.top = `${pos.y}%`;
        flyer.style.zIndex = index === 0 ? 60 : (isNext ? 50 : 30 - index);
        flyer.style.transform = `translate(-50%, -50%) rotateY(${curveRotateY}deg) rotate(${pos.rot}deg)`;
        flyer.style.filter = `brightness(${sideBrightness.toFixed(2)})`;

        const tapeColor = TAPE_COLORS[index % TAPE_COLORS.length];

        const tapeTop = document.createElement("div");
        tapeTop.className = "mini-tape-top";
        tapeTop.style.background = tapeColor;
        flyer.appendChild(tapeTop);

        if (pos.doubleTape) {
          const tapeBottom = document.createElement("div");
          tapeBottom.className = "mini-tape-bottom";
          tapeBottom.style.background = tapeColor;
          flyer.appendChild(tapeBottom);
        }

        const paperSheet = document.createElement("div");
        paperSheet.className = "paper-sheet";

        if (!pos.doubleTape) {
          const animName = index % 2 === 0 ? "paperFlutterA" : "paperFlutterB";
          const waveDelay = (pos.y * 0.025 + (index % 3) * 0.35).toFixed(2);
          paperSheet.style.animationName = animName;
          paperSheet.style.animationDelay = `${waveDelay}s`;
        }

        const inner = document.createElement("div");
        inner.className = "mini-flyer-inner";

        const img = document.createElement("img");
        img.src = item.imageUrl;
        img.alt = "";
        inner.appendChild(img);

        const shade = document.createElement("div");
        shade.className = "cylinder-shade";
        if (pos.x < -8) {
          shade.style.background = "linear-gradient(90deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 60%, rgba(0,0,0,0.07) 100%)";
        } else if (pos.x > 8) {
          shade.style.background = "linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 48%, rgba(0,0,0,0.32) 100%)";
        } else {
          shade.style.background = "linear-gradient(90deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 45%, rgba(0,0,0,0.16) 100%)";
        }
        inner.appendChild(shade);

        paperSheet.appendChild(inner);
        flyer.appendChild(paperSheet);
        flyer.addEventListener("click", () => openZoomReader(index));
        poleFlyersZone.appendChild(flyer);
      });

      updateCursorPosition(nextIdx);
    }

    function resetInspection() {
      isInspected = false;
      readerCard.classList.remove("is-inspected");
      const img = readerCard.querySelector("img");
      if (img) {
        img.style.transformOrigin = "center center";
      }
    }

    function openZoomReader(index) {
      visitedSet.add(index);
      const item = FLYERS_DATA[index];
      readerCard.innerHTML = `<img src="${item.imageUrl}" alt="" />`;
      resetInspection();

      const spots = item.hotspots || [];
      spots.forEach((h) => {
        if (!h || !h.url) return;

        const spot = document.createElement("a");
        spot.className = "hotspot-link";
        spot.href = h.url;
        spot.target = "_blank";
        spot.rel = "noopener noreferrer";
        spot.title = h.label || "開啟外部連結";
        const angle = h.rotate || 0;
        spot.style.left = `${h.left}%`;
        spot.style.top = `${h.top}%`;
        spot.style.width = `${h.width}%`;
        spot.style.height = `${h.height}%`;
        spot.style.transform = `rotate(${angle}deg)`;
        spot.style.transformOrigin = "center center";

        spot.addEventListener("click", (e) => {
          e.stopPropagation();
        });

        // 第 12 張 6 張小圖與第 13 張圖片都顯示引導，閃 3 下後自動淡出
        const hint = document.createElement("div");
        hint.className = "hotspot-hint";
        hint.innerHTML = `
          <div class="cursor-ripple"></div>
          <svg class="cursor-hand" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.5 5.5C11.5 4.11929 12.6193 3 14 3C15.3807 3 16.5 4.11929 16.5 5.5V13.5H17.5C18.6046 13.5 19.5 14.3954 19.5 15.5V16.2H20.5C21.6046 16.2 22.5 17.0954 22.5 18.2V19C23.6046 19 24.5 19.8954 24.5 21V24.5C24.5 27.5376 22.0376 30 19 30H14.5C11.8 30 9.8 28.4 8.4 26.2L5.3 21.3C4.5 20.1 4.9 18.5 6.1 17.7C7.2 17 8.7 17.3 9.5 18.4L11.5 21V5.5Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
        spot.appendChild(hint);

        readerCard.appendChild(spot);
      });

      document.body.classList.add("zoomed");
    }

    function closeZoomReader() {
      resetInspection();
      document.body.classList.remove("zoomed");
      renderAllPoleFlyers();
    }

    readerCard.addEventListener("click", (e) => {
      const img = readerCard.querySelector("img");
      if (!img) return;

      e.stopPropagation();
      const rect = img.getBoundingClientRect();
      const offsetX = ((e.clientX - rect.left) / rect.width) * 100;
      const offsetY = ((e.clientY - rect.top) / rect.height) * 100;

      if (!isInspected) {
        img.style.transformOrigin = `${offsetX.toFixed(1)}% ${offsetY.toFixed(1)}%`;
        readerCard.classList.add("is-inspected");
        isInspected = true;
      } else {
        resetInspection();
      }
    });

    readerCard.addEventListener("mousemove", (e) => {
      if (!isInspected) return;
      const img = readerCard.querySelector("img");
      if (!img) return;

      const rect = img.getBoundingClientRect();
      const offsetX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const offsetY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
      img.style.transformOrigin = `${offsetX.toFixed(1)}% ${offsetY.toFixed(1)}%`;
    });

    closeBtn.addEventListener("click", closeZoomReader);
    backHint.addEventListener("click", closeZoomReader);
    readerOverlay.addEventListener("click", (e) => {
      if (e.target === readerOverlay) closeZoomReader();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("zoomed")) {
        closeZoomReader();
      }
    });

    window.addEventListener("resize", renderAllPoleFlyers);
    renderAllPoleFlyers();

    const bgVideo = document.getElementById("bgVideo");
    document.addEventListener("pointerdown", () => {
      if (bgVideo && bgVideo.muted) {
        bgVideo.volume = 0.6;
        bgVideo.muted = false;
        bgVideo.play().catch(() => {});
      }
    }, { once: true });
  </script>
</body>
</html>
