<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>街角作品集｜15張傳單互動牆</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", Roboto, sans-serif;
      background: #1c1a17;
      position: relative;
    }

    /* ================= 1. 滿版清晰街景背景 ================= */
    .street-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url('./bg.jpg?v=13');
      background-size: cover;
      background-position: 72% center;
      background-repeat: no-repeat;
      transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: filter, transform;
    }

    body.zoomed .street-scene {
      filter: blur(12px) brightness(0.62);
      transform: scale(1.04);
    }

    /* ================= 2. 頂部簡潔進度提示 ================= */
    .header-guide {
      position: absolute;
      top: 20px;
      left: 28px;
      z-index: 20;
      background: rgba(24, 22, 20, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 18px;
      border-radius: 999px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      font-size: 13px;
      color: #f8fafc;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    body.zoomed .header-guide {
      opacity: 0;
      pointer-events: none;
    }

    /* ================= 3. 電線桿上的 15 張傳單容器（配合真實街頭傳單比例） ================= */
    .pole-flyers-zone {
      position: absolute;
      left: 72%;
      top: 50%;
      width: 310px;
      height: 95vh;
      transform: translate(-50%, -50%);
      perspective: 1000px;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    body.zoomed .pole-flyers-zone {
      opacity: 0;
      pointer-events: none;
    }

    /* 單張傳單（放大至 94x132px，模擬街頭真實 A4 傳單比例） */
    .mini-flyer {
      position: absolute;
      width: 94px;
      height: 132px;
      cursor: pointer;
      transition:
        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.25s ease;
      transform-style: preserve-3d;
    }

    .mini-flyer:hover {
      transform: translate(-50%, -50%) scale(1.24) rotate(0deg) !important;
      z-index: 99 !important;
      filter: brightness(1.04) !important;
    }

    /* ================= 4. 微風吹拂紙張飄動動畫 ================= */
    @keyframes paperFlutterA {
      0%, 42%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: -3px 5px 12px rgba(15, 14, 12, 0.45);
      }
      52% {
        transform: rotateX(22deg) rotateY(-8deg) skewX(-2.5deg);
        box-shadow: -6px 14px 20px rgba(15, 14, 12, 0.36);
      }
      60% {
        transform: rotateX(9deg) rotateY(4deg) skewX(1.2deg);
        box-shadow: -4px 8px 14px rgba(15, 14, 12, 0.42);
      }
      68% {
        transform: rotateX(17deg) rotateY(-5deg) skewX(-1.8deg);
        box-shadow: -5px 11px 18px rgba(15, 14, 12, 0.38);
      }
      78% {
        transform: rotateX(3deg) rotateY(1deg) skewX(0.5deg);
        box-shadow: -3px 6px 12px rgba(15, 14, 12, 0.44);
      }
    }

    @keyframes paperFlutterB {
      0%, 38%, 100% {
        transform: rotateX(0deg) rotateY(0deg) skewX(0deg);
        box-shadow: -3px 5px 12px rgba(15, 14, 12, 0.45);
      }
      49% {
        transform: rotateX(25deg) rotateY(9deg) skewX(2.8deg);
        box-shadow: -7px 15px 21px rgba(15, 14, 12, 0.35);
      }
      58% {
        transform: rotateX(10deg) rotateY(-3deg) skewX(-1deg);
        box-shadow: -4px 8px 14px rgba(15, 14, 12, 0.42);
      }
      67% {
        transform: rotateX(19deg) rotateY(6deg) skewX(2deg);
        box-shadow: -5px 12px 18px rgba(15, 14, 12, 0.37);
      }
      76% {
        transform: rotateX(4deg) rotateY(-1deg) skewX(-0.4deg);
        box-shadow: -3px 6px 12px rgba(15, 14, 12, 0.44);
      }
    }

    .paper-sheet {
      width: 100%;
      height: 100%;
      background: #fdfbf7;
      border-radius: 2px;
      position: relative;
      transform-origin: 50% 4px;
      transform-style: preserve-3d;
      animation-duration: 6.5s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      will-change: transform, box-shadow;
    }

    .mini-flyer:hover .paper-sheet {
      animation-play-state: paused;
      transform: rotateX(0deg) rotateY(0deg) skewX(0deg) !important;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.65) !important;
    }

    .mini-flyer.is-next {
      z-index: 45 !important;
    }

    .mini-flyer.is-read .mini-flyer-inner::after {
      content: "✓";
      position: absolute;
      bottom: 5px;
      left: 6px;
      font-size: 11px;
      font-weight: 900;
      color: rgba(15, 23, 42, 0.55);
    }

    .mini-flyer-inner {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 2px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px 9px;
      background-image: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,0.06) 100%);
    }

    .mini-flyer-inner img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-tape {
      position: absolute;
      top: -4.5px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 8px;
      z-index: 10;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .mini-tag {
      font-size: 7.5px;
      font-weight: 800;
      opacity: 0.75;
      letter-spacing: 0.3px;
    }

    .mini-title {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.26;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-num {
      font-size: 9px;
      font-weight: 800;
      opacity: 0.75;
      border-top: 1px dashed rgba(0, 0, 0, 0.25);
      padding-top: 3px;
      text-align: right;
    }

    /* ================= 5. 動態引導滑鼠鼠標（平滑移動指向下一張傳單） ================= */
    .guide-cursor {
      position: absolute;
      width: 44px;
      height: 44px;
      z-index: 80;
      pointer-events: none;
      /* 平滑移動到下一張傳單的位置 */
      transition:
        left 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        top 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.3s ease;
    }

    /* 點擊波紋擴散圈 */
    @keyframes cursorRipple {
      0% {
        transform: translate(-50%, -50%) scale(0.3);
        opacity: 0.85;
      }
      75% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.45);
        opacity: 0;
      }
    }

    .cursor-ripple {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      background: rgba(255, 255, 255, 0.25);
      animation: cursorRipple 1.6s infinite ease-out;
    }

    /* 鼠標輕輕點擊的彈跳動畫 */
    @keyframes cursorTap {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      45% {
        transform: translate(-3px, -4px) scale(0.92);
      }
      65% {
        transform: translate(0, 0) scale(1);
      }
    }

    .cursor-hand {
      width: 36px;
      height: 36px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
      animation: cursorTap 1.6s infinite ease-in-out;
    }

    @media (max-width: 768px) {
      .header-guide {
        left: 50%;
        transform: translateX(-50%);
        font-size: 11.5px;
        padding: 7px 14px;
        white-space: nowrap;
      }
      .pole-flyers-zone {
        left: 68%;
        width: 245px;
      }
      .mini-flyer {
        width: 74px;
        height: 104px;
      }
    }

    /* ================= 6. Zoom-in 放大閱讀視窗 ================= */
    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    body.zoomed .reader-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-card {
      position: relative;
      width: 100%;
      max-width: 520px;
      max-height: 84vh;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.58);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform: scale(0.84) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.zoomed .reader-card {
      transform: scale(1) translateY(0);
    }

    .btn-close {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(24, 22, 20, 0.8);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      z-index: 60;
    }

    .btn-close:hover {
      background: rgba(24, 22, 20, 0.96);
      transform: scale(1.06);
    }

    .reader-viewport {
      width: 100%;
      overflow-y: auto;
      max-height: 76vh;
    }

    .reader-viewport img {
      width: 100%;
      height: auto;
      display: block;
    }

    .reader-footer {
      padding: 14px 20px;
      background: #fafaf9;
      border-top: 1px solid #e7e5e4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 700;
      color: #1c1917;
    }

    .ext-link {
      text-decoration: none;
      background: #1c1917;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .ext-link:hover {
      background: #44403c;
    }

    .back-hint {
      margin-top: 14px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.78);
      letter-spacing: 0.4px;
      cursor: pointer;
    }

    .back-hint:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 1. 滿版清晰街景背景 -->
  <div class="street-scene" id="streetScene"></div>

  <!-- 2. 頂部進度提示 -->
  <div class="header-guide" id="headerGuide">

  <!-- 3. 電線桿上的 15 張傳單區（含動態引導鼠標） -->
  <div class="pole-flyers-zone" id="poleFlyersZone"></div>

  <!-- 4. Zoom-in 放大閱讀視窗 -->
  <div class="reader-overlay" id="readerOverlay">
    <button class="btn-close" id="closeBtn" title="返回電線桿 (ESC)">✕</button>

    <div class="reader-card">

      <div class="reader-footer">

    <div class="back-hint" id="backHint">點擊空白處或按 ESC 返回電線桿挑選下一張</div>
  </div>

  <script>

      { title: "02. 品牌識別重塑專案", tag: "BRANDING", heading: "新創咖啡品牌 CIS 識別設計", desc: "從 Logo 造型、字體規範到外帶杯包裝系統，建立溫暖且具記憶點的品牌形象。", bgColor: "#e0f2fe", textColor: "#0c4a6e", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "03. 年度社群話題操作", tag: "SOCIAL", heading: "IG 互動濾鏡與迷因企劃", desc: "結合時事話題與高共鳴圖文，單月自然觸及突破 45 萬人次。", bgColor: "#fce7f3", textColor: "#831843", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "04. 音樂祭主視覺海報", tag: "POSTER", heading: "城市獨立音樂節主視覺", desc: "運用高對比拼貼與實驗排版，呈現街頭文化與現場音樂的爆發力。", bgColor: "#dcfce7", textColor: "#14532d", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "05. 快閃店空間與動線企劃", tag: "EVENT", heading: "信義區週末快閃體驗店", desc: "負責現場打卡裝置視覺、現場體驗動線設計與 KOL 邀請合作。", bgColor: "#ffedd5", textColor: "#7c2d12", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "06. 食品包裝插畫系列", tag: "PACKAGING", heading: "手工果醬與茶飲禮盒包裝", desc: "以手繪植物插畫搭配燙金工藝，提升節慶禮盒客單價與送禮質感。", bgColor: "#f3e8ff", textColor: "#581c87", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "07. 短影音腳本與視覺指導", tag: "VIDEO", heading: "Reels / TikTok 品牌系列短片", desc: "規劃前 3 秒吸睛鉤子與分鏡視覺，平均完播率提升 38%。", bgColor: "#fef9c3", textColor: "#713f12", imageUrl: "", externalLink: "https://www.behance.net" },

      { title: "10. 聯名周邊商品開發", tag: "MERCH", heading: "街頭潮牌聯名帆布袋與貼紙組", desc: "從插畫創作、材質打樣到社群限量抽獎預熱，開賣 2 小時全數完售。", bgColor: "#d1fae5", textColor: "#064e3b", imageUrl: "", externalLink: "https://www.behance.net" },

      { title: "12. 書籍裝幀與排版設計", tag: "EDITORIAL", heading: "獨立生活風格誌刊物編排", desc: "負責專題攝影藝術指導、網格系統建立與內頁字體排印設計。", bgColor: "#fae8ff", textColor: "#701a75", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "13. 產品攝影與美術指導", tag: "ART DIR.", heading: "香氛系列自然光影情境攝影", desc: "設定拍攝腳本、道具陳列與色調規範，打造一致的品牌社群美學。", bgColor: "#f1f5f9", textColor: "#1e293b", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "14. 數位廣告素材 A/B 測試", tag: "ADS", heading: "Meta 廣告高點擊率視覺優化", desc: "透過多版本視覺與文案測試，將單次獲客成本（CPA）降低 27%。", bgColor: "#fef3c7", textColor: "#92400e", imageUrl: "", externalLink: "https://www.behance.net" },
      { title: "15. 聯絡資訊與面試邀約", tag: "CONTACT", heading: "歡迎與我聯繫聊聊！", desc: "期待有機會加入貴團隊，一起打造兼具美感與影響力的作品。", bgColor: "#dcfce7", textColor: "#166534", imageUrl: "", externalLink: "mailto:example@email.com" }

    /**
     * 配合 94x132px 放大版傳單的寬敞錯落座標：
     * 利用電線桿左右兩側與上下全長自然交錯排列，兼具街頭層次感與清晰可視性
     */
    const POLE_LAYOUT = [
      { x: -20, y:  7.5, rot: -4 },
      { x:  21, y: 10.5, rot:  5 },
      { x:  -2, y: 19.0, rot:  2 },
      { x: -24, y: 26.5, rot: -5 },
      { x:  23, y: 29.5, rot:  4 },
      { x:   1, y: 38.0, rot: -2 },
      { x: -22, y: 45.5, rot:  5 },
      { x:  21, y: 48.5, rot: -4 },
      { x:  -1, y: 57.0, rot:  3 },
      { x: -23, y: 64.5, rot: -5 },
      { x:  22, y: 67.0, rot:  5 },
      { x:   0, y: 75.5, rot: -2 },
      { x: -21, y: 83.0, rot:  4 },
      { x:  20, y: 85.5, rot: -4 },
      { x:  -1, y: 92.5, rot:  2 }
    ];

    const TAPE_COLORS = [
      "rgba(215, 42, 42, 0.85)",
      "rgba(234, 179, 8, 0.82)",
      "rgba(214, 195, 165, 0.88)",
      "rgba(59, 130, 246, 0.78)"
    ];

    const poleFlyersZone = document.getElementById("poleFlyersZone");
    const guideText = document.getElementById("guideText");
    const readerOverlay = document.getElementById("readerOverlay");
    const readerViewport = document.getElementById("readerViewport");
    const pageTitle = document.getElementById("pageTitle");
    const extLink = document.getElementById("extLink");
    const closeBtn = document.getElementById("closeBtn");
    const backHint = document.getElementById("backHint");

    const visitedSet = new Set();
    let guideCursorEl = null;

    function getNextUnreadIndex() {
      for (let i = 0; i < FLYERS_15.length; i++) {
        if (!visitedSet.has(i)) return i;
      }
      return -1;
    }

    // 建立只建構一次的「虛擬小手鼠標」，讓它可以平滑滑動到下一張傳單
    function ensureGuideCursor() {
      if (!guideCursorEl) {
        guideCursorEl = document.createElement("div");
        guideCursorEl.className = "guide-cursor";
        guideCursorEl.innerHTML = `
          <div class="cursor-ripple"></div>
          <svg class="cursor-hand" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.5 5.5C11.5 4.11929 12.6193 3 14 3C15.3807 3 16.5 4.11929 16.5 5.5V13.5H17.5C18.6046 13.5 19.5 14.3954 19.5 15.5V16.2H20.5C21.6046 16.2 22.5 17.0954 22.5 18.2V19C23.6046 19 24.5 19.8954 24.5 21V24.5C24.5 27.5376 22.0376 30 19 30H14.5C11.8 30 9.8 28.4 8.4 26.2L5.3 21.3C4.5 20.1 4.9 18.5 6.1 17.7C7.2 17 8.7 17.3 9.5 18.4L11.5 21V5.5Z" fill="#FFFFFF" stroke="#18181B" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        `;
      }
      if (!poleFlyersZone.contains(guideCursorEl)) {
        poleFlyersZone.appendChild(guideCursorEl);
      }
    }

    function updateCursorPosition(nextIdx) {
      ensureGuideCursor();
      if (nextIdx === -1) {
        guideCursorEl.style.opacity = "0";
        return;
      }
      const pos = POLE_LAYOUT[nextIdx] || { x: 0, y: 50 };
      // 將鼠標指尖精準對準該張傳單的中央偏右下處，不遮擋標題
      const cursorLeft = 50 + pos.x + 4;
      const cursorTop = pos.y + 3;
      guideCursorEl.style.opacity = "1";
      guideCursorEl.style.left = `${cursorLeft}%`;
      guideCursorEl.style.top = `${cursorTop}%`;
    }

    function renderAllPoleFlyers() {
      // 保留鼠標元素，重新渲染 15 張傳單
      const flyersOnly = poleFlyersZone.querySelectorAll(".mini-flyer");
      flyersOnly.forEach(el => el.remove());

      const nextIdx = getNextUnreadIndex();

      if (visitedSet.size === 0) {
        guideText.textContent = "👆 跟著小手鼠標，從第 1 張傳單開始依序點擊閱讀（0 / 15）";
      } else if (nextIdx !== -1) {
        guideText.textContent = `👆 請繼續點擊小手鼠標指著的第 ${nextIdx + 1} 張傳單（已閱 ${visitedSet.size} / 15）`;
      } else {
        guideText.textContent = "🎉 已瀏覽全部 15 張作品！可隨時點擊任一張重看";
      }

      FLYERS_15.forEach((item, index) => {
        const pos = POLE_LAYOUT[index] || { x: 0, y: 50, rot: 0 };
        const flyer = document.createElement("div");
        flyer.className = "mini-flyer";

        const isNext = index === nextIdx;
        const isRead = visitedSet.has(index);

        if (isNext) flyer.classList.add("is-next");
        if (isRead) flyer.classList.add("is-read");

        const leftPercent = 50 + pos.x;
        const curveRotateY = pos.x * 0.65;
        const shadeBrightness = (isRead ? 0.92 : 1) - Math.max(0, pos.x * 0.004);

        flyer.style.left = `${leftPercent}%`;
        flyer.style.top = `${pos.y}%`;
        flyer.style.zIndex = isNext ? 45 : 10 + (index % 4);
        flyer.style.transform = `translate(-50%, -50%) rotateY(${curveRotateY}deg) rotate(${pos.rot}deg)`;
        flyer.style.filter = `brightness(${shadeBrightness.toFixed(2)})`;
        flyer.title = `${item.title}（點擊放大閱讀）`;

        const tape = document.createElement("div");
        tape.className = "mini-tape";
        tape.style.background = TAPE_COLORS[index % TAPE_COLORS.length];
        flyer.appendChild(tape);

        const paperSheet = document.createElement("div");
        paperSheet.className = "paper-sheet";
        const animName = index % 2 === 0 ? "paperFlutterA" : "paperFlutterB";
        const waveDelay = (pos.y * 0.028 + (index % 3) * 0.35).toFixed(2);
        paperSheet.style.animationName = animName;
        paperSheet.style.animationDelay = `${waveDelay}s`;

        const inner = document.createElement("div");
        inner.className = "mini-flyer-inner";
        inner.style.backgroundColor = item.bgColor;
        inner.style.color = item.textColor;

        if (item.imageUrl && item.imageUrl.trim() !== "") {
          inner.innerHTML = `<img src="${item.imageUrl}" alt="${item.title}" />`;
        } else {
          inner.innerHTML = `
            <div>
              <div class="mini-tag">${item.tag}</div>
              <div class="mini-title">${item.heading}</div>
            </div>
            <div class="mini-num">#${String(index + 1).padStart(2, "0")}</div>
          `;
        }

        paperSheet.appendChild(inner);
        flyer.appendChild(paperSheet);
        flyer.addEventListener("click", () => openZoomReader(index));
        poleFlyersZone.appendChild(flyer);
      });

      // 將小手鼠標平滑移動到下一張要看的傳單上方
      updateCursorPosition(nextIdx);
    }

    function openZoomReader(index) {
      visitedSet.add(index);
      const item = FLYERS_15[index];

      pageTitle.textContent = item.title;

      if (item.externalLink && item.externalLink.trim() !== "") {
        extLink.href = item.externalLink;
        extLink.style.display = "inline-block";
      } else {
        extLink.style.display = "none";
      }

      if (item.imageUrl && item.imageUrl.trim() !== "") {
        readerViewport.innerHTML = `<img src="${item.imageUrl}" alt="${item.title}" />`;
      } else {
        readerViewport.innerHTML = `
          <div style="padding: 44px 32px; background:${item.bgColor}; color:${item.textColor}; min-height: 400px; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
              <span style="font-size:12px; font-weight:700; padding:4px 10px; border-radius:4px; background:rgba(0,0,0,0.08);">${item.tag}</span>
              <h2 style="font-size:28px; font-weight:800; margin-top:16px; line-height:1.35;">${item.heading}</h2>
              <p style="font-size:16px; line-height:1.8; margin-top:16px;">${item.desc}</p>
            </div>
            <p style="font-size:12.5px; opacity:0.72; margin-top:32px;">（提示：將程式碼內第 ${index + 1} 項的 imageUrl 換成圖片檔名後，這裡就會顯示高清設計原圖）</p>
          </div>
        `;
      }

      readerViewport.scrollTop = 0;
      document.body.classList.add("zoomed");
    }

    function closeZoomReader() {
      document.body.classList.remove("zoomed");
      renderAllPoleFlyers();
    }

    closeBtn.addEventListener("click", closeZoomReader);
    backHint.addEventListener("click", closeZoomReader);
    readerOverlay.addEventListener("click", (e) => {
      if (e.target === readerOverlay) closeZoomReader();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("zoomed")) {
        closeZoomReader();
      }
    });

    renderAllPoleFlyers();
  </script>
</body>
</html>
